<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>U9 Login/Register</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="stylesheet" href="index.css" />

  <!-- Supabase SDK -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <!-- 全局 Supabase 初始化 -->
  <script src="supabaseClient.js"></script>
</head>
<body>
  <div class="container">
    <h1>Welcome</h1>

    <!-- Tab -->
    <button id="showLogin" class="tab-btn active">Login</button>
    <button id="showRegister" class="tab-btn">Register</button>

    <!-- 登录表单 -->
    <div id="loginForm">
      <input type="text" id="loginUsername" placeholder="Username" />
      <input type="password" id="loginPassword" placeholder="Password" />
      <button id="loginBtn">Login</button>
    </div>

    <!-- 注册表单 -->
    <div id="registerForm" class="hidden">
      <input type="text" id="regUsername" placeholder="Username" />
      <input type="password" id="regPassword" placeholder="Password" />
      <input type="password" id="regConfirmPassword" placeholder="Confirm Password" />
      <input type="checkbox" id="agreeTerms" /> I agree
      <button id="registerBtn">Register</button>
    </div>
  </div>

  <script type="module" src="index.js"></script>
</body>
</html>
