<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Anna Global</title>
  <link rel="stylesheet" href="index.css">
  <!-- Supabase SDK -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <!-- 全局 Supabase 初始化 -->
  <script src="supabaseClient.js"></script>
</head>
<body>
  <!-- 🌐 语言选择 -->
  <div class="lang-switch">
    <select id="language">
      <option value="en">English</option>
      <option value="zh">中文</option>
      <option value="jp">日本語</option>
    </select>
  </div>

  <h1 id="title">Welcome</h1>
  <p id="description">Please register or login below:</p>

  <!-- 切换注册 / 登录按钮 -->
  <div class="tab-container">
    <button id="showLogin" class="active">Login</button>
    <button id="showRegister">Register</button>
  </div>

  <!-- 登录窗口 -->
  <div id="loginForm" class="form-container">
    <input type="text" id="loginUsername" placeholder="Username">
    
    <div class="password-wrapper">
      <input type="password" id="loginPassword" placeholder="Password">
      <span class="toggle-password" onclick="togglePassword('loginPassword', this)">👁️</span>
    </div>

    <button id="loginBtn">Login</button>
  </div>

  <!-- 注册窗口 -->
  <div id="registerForm" class="form-container hidden">
    <input type="text" id="regUsername" placeholder="Username">

    <div class="password-wrapper">
      <input type="password" id="regPassword" placeholder="Password">
      <span class="toggle-password" onclick="togglePassword('regPassword', this)">👁️</span>
    </div>

    <div class="password-wrapper">
      <input type="password" id="regConfirmPassword" placeholder="Confirm Password">
      <span class="toggle-password" onclick="togglePassword('regConfirmPassword', this)">👁️</span>
    </div>

    <label class="agreement">
      <input type="checkbox" id="agreeTerms"> ✅ I agree to the terms
    </label>

    <button id="registerBtn">Register</button>
  </div>

  <!-- 业务逻辑 -->
  <script src="index.js"></script>
</body>
</html>
