<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>U9 登录 / 注册</title>
  <style>
    body { font-family: Arial, sans-serif; display:flex; justify-content:center; align-items:center; height:100vh; background:#f0f2f5; }
    .container { background:#fff; padding:30px; border-radius:8px; box-shadow:0 0 15px rgba(0,0,0,0.1); width:300px; }
    h2 { text-align:center; margin-bottom:20px; }
    input { width:100%; padding:8px; margin:8px 0; border-radius:4px; border:1px solid #ccc; }
    button { width:100%; padding:10px; border:none; border-radius:4px; background:#4caf50; color:#fff; font-weight:bold; cursor:pointer; margin-top:10px; }
    button:hover { background:#45a049; }
    .switch { text-align:center; margin-top:10px; cursor:pointer; color:#007bff; }
    .switch:hover { text-decoration:underline; }
    .error { color:red; font-size:14px; margin-top:5px; text-align:center; }
  </style>
</head>
<body>
  <div class="container">
    <h2 id="formTitle">登录</h2>

    <input type="text" id="username" placeholder="用户名" />
    <input type="password" id="password" placeholder="密码" />
    <div class="error" id="errorMsg"></div>
    <button id="submitBtn">登录</button>

    <div class="switch" id="toggleForm">没有账号？点击注册</div>
  </div>

  <!-- 引入 Supabase SDK -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/supabase.min.js"></script>
  <!-- 初始化 supabaseClient -->
  <script src="supabaseClient.js" defer></script>
  <script>
    window.supabaseClient = supabase.createClient(
      "https://ofaxbeydyeajdgwwqrzz.supabase.co",
      "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im9mYXhiZXlkeWVhamRnd3dxcnp6Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NTg0NzQxMTQsImV4cCI6MjA3NDA1MDExNH0.mJGdh6BBEy2Mp83H7aBEo3wIFyIsUsVfqgTErgsvFdY"
    );
  </script>

  <!-- 登录/注册逻辑 -->
  <script>
    let isLogin = true;

    const formTitle = document.getElementById("formTitle");
    const submitBtn = document.getElementById("submitBtn");
    const toggleForm = document.getElementById("toggleForm");
    const errorMsg = document.getElementById("errorMsg");

    toggleForm.addEventListener("click", () => {
      isLogin = !isLogin;
      formTitle.textContent = isLogin ? "登录" : "注册";
      submitBtn.textContent = isLogin ? "登录" : "注册";
      toggleForm.textContent = isLogin ? "没有账号？点击注册" : "已有账号？点击登录";
      errorMsg.textContent = "";
    });

    submitBtn.addEventListener("click", async () => {
      const username = document.getElementById("username").value.trim();
      const password = document.getElementById("password").value.trim();
      if (!username || !password) {
        errorMsg.textContent = "用户名和密码不能为空";
        return;
      }

      errorMsg.textContent = "";

      try {
        if (isLogin) {
          // 登录
          const { data, error } = await supabaseClient
            .from("users")
            .select("*")
            .eq("username", username)
            .eq("password", password) // 简单明文示例，生产请用哈希
            .single();

          if (error || !data) {
            errorMsg.textContent = "用户名或密码错误";
            return;
          }

          // 登录成功，存储 session
          localStorage.setItem("currentUserId", data.id);
          localStorage.setItem("currentUser", data.username);
          localStorage.setItem("currentUserUUID", data.uuid);

          // 跳转到 HOME
          window.location.href = "frontend/HOME.html";

        } else {
          // 注册
          const { data: existing } = await supabaseClient
            .from("users")
            .select("id")
            .eq("username", username)
            .single();

          if (existing) {
            errorMsg.textContent = "用户名已存在";
            return;
          }

          const { data, error } = await supabaseClient
            .from("users")
            .insert([{ username, password }])
            .select()
            .single();

          if (error || !data) {
            errorMsg.textContent = "注册失败，请稍后重试";
            return;
          }

          // 注册成功自动登录
          localStorage.setItem("currentUserId", data.id);
          localStorage.setItem("currentUser", data.username);
          localStorage.setItem("currentUserUUID", data.uuid);

          window.location.href = "frontend/HOME.html";
        }
      } catch (err) {
        errorMsg.textContent = err.message || "操作失败";
      }
    });
  </script>
</body>
</html>
