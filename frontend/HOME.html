<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HOME - 订单管理</title>
<style>
  body { font-family: Arial, sans-serif; margin: 0; padding: 2rem; background: #f0f2f5; }
  h2 { margin-top: 0; }
  #autoOrderBtn { padding: 0.5rem 1rem; font-size: 1rem; cursor: pointer; margin-bottom: 1rem; }
  #ordercoins, #balance { font-weight: bold; }
  #orderResult, #recentOrders { background: white; padding: 1rem; margin-bottom: 1rem; border-radius: 8px; box-shadow: 0 0 5px rgba(0,0,0,0.1); }
  ul { padding-left: 1.2rem; }
  #addCoinsModal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); justify-content: center; align-items: center; }
  #addCoinsModal .modal-content { background: white; padding: 2rem; border-radius: 10px; width: 300px; }
  #matchingGif { display: none; width: 50px; height: 50px; }
  button { border: none; border-radius: 5px; padding: 0.5rem 1rem; cursor: pointer; }
  #confirmExchange { background: #4CAF50; color: white; }
  #cancelExchange { background: #ccc; color: black; margin-left: 0.5rem; }
</style>
</head>
<body>

<h2>欢迎, <span id="usernameDisplay">用户</span></h2>
<p>金币: <span id="ordercoins">0</span> | 余额: <span id="balance">0</span></p>
<button id="autoOrderBtn">🎲 一键刷单</button>
<img id="matchingGif" src="https://i.gifer.com/ZZ5H.gif" alt="匹配中">

<div id="orderResult"></div>

<div class="order-history">
  <h3>🕘 最近订单</h3>
  <ul id="recentOrders"></ul>
</div>

<button id="addCoinsBtn">兑换 Coins / Balance</button>

<!-- 兑换弹窗 -->
<div id="addCoinsModal">
  <div class="modal-content">
    <h3>兑换 Coins / Balance</h3>
    <input type="number" id="addCoinsInput" placeholder="输入数量">
    <div style="margin-top:1rem;">
      <button id="confirmExchange">确认兑换</button>
      <button id="cancelExchange">取消</button>
    </div>
    <div style="margin-top:0.5rem;">
      <button id="coinsToBalanceBtn">Coins → Balance</button>
      <button id="balanceToCoinsBtn">Balance → Coins</button>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/supabase.min.js"></script>
<script src="../supabaseClient.js"></script>
<script src="./order.js"></script>
<script>
  // 初始化显示用户名
  const currentUser = localStorage.getItem("currentUser") || "用户";
  document.getElementById("usernameDisplay").textContent = currentUser;

  // 页面刷新后尝试恢复匹配
  restoreMatchingIfAny();
</script>

</body>
</html>
