<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Home</title>
  <link rel="stylesheet" href="home.css">
  <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
</head>
<body>

  <!-- 页面内容 -->
  <div id="homePage" class="page active">🏠 首页内容</div>
  <div id="infoPage" class="page">ℹ️ 信息内容</div>
  <div id="orderPage" class="page">📦 订单内容</div>
  <div id="msgPage" class="page">💬 消息内容</div>

  <!-- 我的页面 -->
  <div id="myPage" class="page">
    <h2>👤 我的页面</h2>
    <div class="account-info">
      <p>平台账号：<span id="platformAccount">加载中...</span></p>
      <p>余额：<span id="balance">加载中...</span></p>
    </div>

    <div class="my-buttons">
      <button>按钮1</button>
      <button>按钮2</button>
      <button>按钮3</button>
      <button>按钮4</button>
      <button id="logoutBtn">🚪 Logout</button>
    </div>
  </div>

  <!-- 底部导航栏 -->
  <div class="bottom-nav">
    <button data-page="homePage" class="active">首页</button>
    <button data-page="infoPage">信息</button>
    <button data-page="orderPage">订单</button>
    <button data-page="msgPage">消息</button>
    <button data-page="myPage">我的</button>
  </div>

  <!-- Logout 确认弹窗 -->
  <div id="logoutModal" class="modal">
    <div class="modal-content">
      <p>确定要退出吗？</p>
      <button id="cancelLogout">否</button>
      <button id="confirmLogout">确定</button>
    </div>
  </div>

  <script src="home.js"></script>
</body>
</html>
