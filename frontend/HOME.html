<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>U9</title>

  <!-- 各页面 CSS -->
  <link rel="stylesheet" href="Home/home.css">
  <link rel="stylesheet" href="About/about.css">
  <link rel="stylesheet" href="Order/order.css">
  <link rel="stylesheet" href="Message/message.css">
  <link rel="stylesheet" href="Me/me.css">
  <!-- 底部导航 CSS -->
  <link rel="stylesheet" href="Button/button.css">

  <!-- Supabase SDK -->
  <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
  <script src="../supabaseClient.js"></script>
</head>
<body>

  <!-- 首页 -->
  <div id="homePage" class="page active">🏠 HOME</div>

  <!-- 信息 -->
  <div id="infoPage" class="page">💬 MESSAGE</div>

  <!-- 订单 -->
  <div id="orderPage" class="page">
    <div class="order-header">
      <h2>📦 ORDER</h2>
      <div class="coins-box">
        💰 Coins: <span id="ordercoins">0</span>
        <button id="addCoinsBtn" title="从余额兑换 Coins">+</button>
      </div>
      <div class="limit-box">
        📊 今日订单进度: <span id="orderProgress">0/0 单</span>
      </div>
    </div>

    <div class="order-actions">
      <button id="autoOrderBtn">🎲 一键刷单</button>
      <button id="rechargeBtn">💳 充值</button>
      <button id="exchangeBtn" disabled>🔄 Coins → Balance</button>
    </div>

    <!-- 下单结果 -->
    <div id="orderResult" class="order-result"></div>

    <!-- 最近订单 -->
    <div class="order-history">
      <h3>🕘 最近订单</h3>
      <ul id="recentOrders">
        <li>暂无订单！</li>
      </ul>
    </div>

    <!-- 余额兑换 Coins 弹窗 -->
    <div id="addCoinsModal" class="modal">
      <div class="modal-content">
        <h3>兑换 Coins</h3>
        <p>请输入要兑换的数量：</p>
        <input type="number" id="addCoinsInput" min="1" placeholder="输入数量" />
        <div class="modal-actions">
          <button id="cancelAddCoins">取消</button>
          <button id="confirmAddCoins">确认</button>
        </div>
      </div>
    </div>
  </div>

  <!-- 关于 -->
  <div id="msgPage" class="page">ℹ️ 关于我们</div>

  <!-- 我的 -->
  <div id="myPage" class="page">
    <h2>👤 我的页面</h2>
    <div class="user-info">
      <p><strong>平台账号：</strong><span id="platformAccount">加载中...</span></p>
      <p><strong>Coins：</strong><span id="coins">加载中...</span></p>
      <p><strong>Balance：</strong><span id="balance">加载中...</span></p>
    </div>

    <div class="my-buttons">
      <button>按钮1</button>
      <button>按钮2</button>
      <button>按钮3</button>
      <button>按钮4</button>
      <button id="logoutBtn">Logout</button>
    </div>
  </div>

  <!-- Logout 弹窗 -->
  <div id="logoutModal" class="modal">
    <div class="modal-content">
      <p>确定要退出吗？</p>
      <button id="cancelLogout">否</button>
      <button id="confirmLogout">确定</button>
    </div>
  </div>

  <!-- 底部导航 -->
  <div class="bottom-nav">
    <button data-page="homePage" class="active">Home</button>
    <button data-page="infoPage">Message</button>
    <button data-page="orderPage">Order</button>
    <button data-page="msgPage">About</button>
    <button data-page="myPage">Me</button>
  </div>

  <!-- 各页面 JS -->
  <script src="Home/home.js"></script>
  <script src="Message/message.js"></script>
  <script src="Order/order.js"></script>
  <script src="About/about.js"></script>
  <script src="Me/me.js"></script>
  <!-- 底部按钮 JS -->
  <script src="Button/button.js"></script>

</body>
</html>
