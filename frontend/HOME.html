<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>U9</title>

  <!-- css 部分 -->
  <link rel="stylesheet" href="Home/home.css">
  <link rel="stylesheet" href="About/about.css">
  <link rel="stylesheet" href="Order/order.css">
  <link rel="stylesheet" href="Message/message.css">
  <link rel="stylesheet" href="Me/me.css">
  <link rel="stylesheet" href="Button/button.css">

  <!-- Supabase SDK -->
  <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
  <!-- 全局 Supabase 初始化 -->
  <script src="../supabaseClient.js"></script>
</head>
<body>

  <!-- 首页 -->
  <div id="homePage" class="page active">
    <h2>🏠 HOME</h2>
  </div>

  <!-- 信息页面 -->
  <div id="infoPage" class="page">
    <h2>💬 MESSAGE</h2>
  </div>

  <!-- 订单页面 -->
  <div id="orderPage" class="page">
    <div class="order-header">
      <h2>📦 ORDER</h2>
      <div class="coins-box">
        💰 Coins: <span id="ordercoins">0</span>
        <button id="addCoinsBtn" type="button" title="账户兑换">⇋</button>
      </div>
    </div>

    <div class="order-actions">
      <button id="autoOrderBtn" type="button">🎲 一键刷单</button>
    </div>

    <div id="orderResult" class="order-result"></div>

    <div class="order-history">
      <h3>🕘 最近订单</h3>
      <ul id="recentOrders">
        <li>暂无订单！</li>
      </ul>
    </div>

    <!-- Coins / Balance 兑换弹窗 -->
    <div id="addCoinsModal" class="modal">
      <div class="modal-content">
        <h3>💱 账户兑换</h3>

        <!-- 切换类型按钮 -->
        <div class="exchange-type-buttons">
          <button id="selectCoins" class="active" type="button">Coins</button>
          <button id="selectBalance" class="inactive" type="button">Balance</button>
        </div>

        <!-- 显示账户可用 -->
        <p id="availableLabel">可用 Coins：0.00</p>

        <!-- 输入兑换数量 -->
        <p>兑换数量：</p>
        <input type="number" id="addCoinsInput" min="1" placeholder="输入数量" />

        <!-- 弹窗操作按钮 -->
        <div class="modal-actions">
          <button id="cancelAddCoins" type="button">取消</button>
          <button id="confirmAddCoins" type="button">确认</button>
        </div>
      </div>
    </div>

  </div>

  <!-- 关于我们 -->
  <div id="msgPage" class="page">
    <h2>ℹ️ 关于我们</h2>
  </div>

  <!-- 我的页面 -->
  <div id="myPage" class="page">
    <h2>👤 我的页面</h2>

    <!-- 用户信息 -->
    <div class="user-info">
      <p><strong>用户名：</strong><span id="username">加载中...</span></p>
      <p><strong>平台账号：</strong><span id="platformAccount">加载中...</span></p>
    </div>

    <!-- 余额和提现区域 -->
    <div class="balance-box">
      <p><strong>Balance：</strong><span id="balance">0.00</span></p>
      <div class="balance-actions">
        <button id="depositBtn" type="button">充值</button>
        <button id="withdrawBtn" type="button">提现</button>
      </div>
    </div>

    <!-- 账户操作 -->
    <div class="my-buttons">
      <button id="logoutBtn" type="button">Logout</button>
    </div>
  </div>

  <!-- Logout 确认弹窗 -->
  <div id="logoutModal" class="modal">
    <div class="modal-content">
      <p>确定要退出吗？</p>
      <div class="modal-actions">
        <button id="cancelLogout" type="button">否</button>
        <button id="confirmLogout" type="button">确定</button>
      </div>
    </div>
  </div>

  <!-- 提现窗口 -->
  <div id="withdrawModal" class="modal">
    <div class="modal-content">
      <h3>提现</h3>
      <p>当前余额：<span id="withdrawBalance">0.00</span></p>
      <input type="number" id="withdrawAmount" placeholder="输入提现金额" min="1" required />
      <input type="text" id="walletAddress" placeholder="USDT-TRC20钱包地址" required />
      <button id="setPasswordBtn" type="button">添加提现密码</button>
      <div class="modal-actions">
        <button id="cancelWithdraw" type="button">取消</button>
        <button id="confirmWithdraw" type="button">提交</button>
      </div>
    </div>
  </div>

  <!-- 设置密码窗口 -->
  <div id="setPasswordModal" class="modal">
    <div class="modal-content">
      <h3>设置提现密码</h3>
      <input type="password" id="withdrawPwd" maxlength="6" placeholder="输入6位数字密码" required />
      <input type="password" id="confirmWithdrawPwd" maxlength="6" placeholder="确认密码" required />
      <div class="modal-actions">
        <button id="cancelSetPwd" type="button">取消</button>
        <button id="saveWithdrawPwd" type="button">保存</button>
      </div>
    </div>
  </div>

  <!-- 更新密码窗口 -->
  <div id="updatePasswordModal" class="modal">
    <div class="modal-content">
      <h3>更改提现密码</h3>
      <input type="password" id="oldWithdrawPwd" maxlength="6" placeholder="输入原密码" required />
      <input type="password" id="newWithdrawPwd" maxlength="6" placeholder="输入新密码" required />
      <input type="password" id="confirmNewWithdrawPwd" maxlength="6" placeholder="确认新密码" required />
      <div class="modal-actions">
        <button id="cancelUpdatePwd" type="button">取消</button>
        <button id="saveUpdatePwd" type="button">保存</button>
      </div>
    </div>
  </div>

  <!-- 确认提现密码窗口 -->
  <div id="confirmPwdModal" class="modal">
    <div class="modal-content">
      <h3>输入提现密码</h3>
      <input type="password" id="inputWithdrawPwd" maxlength="6" placeholder="请输入密码" required />
      <div class="modal-actions">
        <button id="cancelConfirmPwd" type="button">取消</button>
        <button id="submitWithdrawFinal" type="button">提交</button>
      </div>
    </div>
  </div>

  <!-- 底部导航栏 -->
  <div class="bottom-nav">
    <button data-page="homePage" class="active" type="button">Home</button>
    <button data-page="infoPage" type="button">Message</button>
    <button data-page="orderPage" type="button">Order</button>
    <button data-page="msgPage" type="button">About</button>
    <button data-page="myPage" type="button">Me</button>
  </div>

  <!-- JS 部分 -->
  <script src="Home/home.js"></script>
  <script src="Message/message.js"></script>
  <script src="Order/order.js"></script>
  <script src="About/about.js"></script>
  <script src="Me/me.js"></script>
  <script src="Button/button.js"></script>

</body>
</html>
