<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>U9</title>

  <!-- CSS -->
  <link rel="stylesheet" href="Home/home.css">
  <link rel="stylesheet" href="About/about.css">
  <link rel="stylesheet" href="Order/order.css">
  <link rel="stylesheet" href="Message/message.css">
  <link rel="stylesheet" href="Me/me.css">
  <link rel="stylesheet" href="Button/button.css">

  <!-- Supabase SDK -->
  <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
  <script src="../supabaseClient.js"></script>
</head>
<body>

  <!-- ===================== 首页 ===================== -->
  <div id="homePage" class="page active">
    <div class="ad-container">
      <img id="adImage" src="" alt="广告" />
    </div>

    <div class="marquee-container">
      <span class="marquee-icon">🔈</span>
      <div class="marquee-wrapper">
        <span class="marquee-text">欢迎来到我的平台，恭喜发出🎉！</span>
      </div>
    </div>

    <div class="ad-category-container">
      <div class="category-ad-grid">
        <div class="ad-item" data-category="phone"></div>
        <div class="ad-item" data-category="phone"></div>
        <div class="ad-item" data-category="phone"></div>
        <div class="ad-item" data-category="phone"></div>

        <div class="ad-item" data-category="clothes"></div>
        <div class="ad-item" data-category="clothes"></div>
        <div class="ad-item" data-category="clothes"></div>
        <div class="ad-item" data-category="clothes"></div>

        <div class="ad-item" data-category="car"></div>
        <div class="ad-item" data-category="car"></div>
        <div class="ad-item" data-category="car"></div>
        <div class="ad-item" data-category="car"></div>

        <div class="ad-item" data-category="cosmetics"></div>
        <div class="ad-item" data-category="cosmetics"></div>
        <div class="ad-item" data-category="cosmetics"></div>
        <div class="ad-item" data-category="cosmetics"></div>

        <div class="ad-item" data-category="diamond"></div>
        <div class="ad-item" data-category="diamond"></div>
        <div class="ad-item" data-category="diamond"></div>
        <div class="ad-item" data-category="diamond"></div>
      </div>

      <div class="category-buttons">
        <button class="category-btn active" data-category="phone">Phones</button>
        <button class="category-btn" data-category="clothes">Clothing</button>
        <button class="category-btn" data-category="car">Car</button>
        <button class="category-btn" data-category="cosmetics">化妆品</button>
        <button class="category-btn" data-category="diamond">钻石</button>
      </div>
    </div>

    <div class="rank-section">
      <h3>🏆 Ranking list</h3>
      <ul class="rank-list">
        <li><span class="rank-num">1</span> iPhone 15 Pro Max <strong>销量 12%</strong></li>
        <li><span class="rank-num">2</span> 钻石项链 <strong>销量 9%</strong></li>
        <li><span class="rank-num">3</span> 豪华轿车 <strong>销量 7%</strong></li>
        <li><span class="rank-num">4</span> 名牌手袋 <strong>销量 5%</strong></li>
        <li><span class="rank-num">5</span> 口红套装 <strong>销量 3%</strong></li>
      </ul>
    </div>
  </div>

  <!-- ===================== 信息页面 ===================== -->
  <div id="infoPage" class="page">
    <div id="openChatBtn" class="support-box">
      <img src="https://airkbwolmkidaokqhxjj.supabase.co/storage/v1/object/public/Photos/123.jpg" alt="客服图标">
      <span>在线客服</span>
      <span class="unread-dot">0</span>
    </div>

    <div class="telegram-box">
      <img src="https://airkbwolmkidaokqhxjj.supabase.co/storage/v1/object/public/Photos/123.jpg" alt="Telegram 图标">
      <div class="telegram-info">
        <p id="telegramAccount">@U9_support</p>
        <button id="copyTelegramBtn">复制</button>
      </div>
    </div>
  </div>

  <!-- 聊天窗口 -->
  <div id="chatWindow" class="chat-window hidden">
    <div class="chat-header">
      <button id="backBtn">⬅ 返回</button>
    </div>
    <div id="chatMessages" class="chat-messages"></div>
    <div class="chat-input">
      <textarea id="chatInput" placeholder="输入消息..."></textarea>
      <button id="sendBtn">发送</button>
    </div>
  </div>

  <!-- ===================== 订单页面 ===================== -->
  <div id="orderPage" class="page">
    <div class="order-header">
      <div class="coins-box">
        Coins: <span id="ordercoins">0</span>
        <button id="addCoinsBtn" title="从余额兑换Coins">+</button>
      </div>
    </div>

    <div class="imgorder">
      <img src="https://airkbwolmkidaokqhxjj.supabase.co/storage/v1/object/public/Photos/12314.png" alt="图">
    </div>

    <div class="order-actions">
      <div class="left-side">
        <img id="fixedImg" src="https://airkbwolmkidaokqhxjj.supabase.co/storage/v1/object/public/Home%20Photos/331.png" alt="固定图片" class="fixed-img">
        <img id="matchingGif" src="https://airkbwolmkidaokqhxjj.supabase.co/storage/v1/object/public/Photos/Qbox.gif" alt="Ordering..." style="width:150px; height:150px; display:none; margin-top:10px;">
      </div>
      <div class="right-side">
        <button id="autoOrderBtn">Order</button>
      </div>
    </div>

    <div class="order-roundandcoldown">
      <div id="roundProgress"></div>
      <p id="cooldownDisplay"></p>
    </div>

    <div id="orderResult" class="order-result"></div>

    <div class="dulcontainer">
      <div class="left-box">H</div>
      <div class="right-box">i</div>
    </div>

    <!-- Balance / Coins 兑换弹窗 -->
    <div id="addCoinsModal" class="modal">
      <div class="modal-content">
        <h3>Exchange</h3>
        <div class="exchange-toggle">
          <button id="balanceToCoinsBtn" class="exchange-btn active" data-type="toCoins">Balance → Coins</button>
          <button id="coinsToBalanceBtn" class="exchange-btn" data-type="toBalance">Coins → Balance</button>
        </div>
        <p>请输入要兑换的数量：</p>
        <input type="number" id="addCoinsInput" min="1" placeholder="输入数量" />
        <div class="modal-actions">
          <button id="cancelExchange">取消</button>
          <button id="confirmExchange">确认</button>
        </div>
      </div>
    </div>
  </div>

  <!-- ===================== 关于我们 ===================== -->
  <div id="msgPage" class="page">ℹ️ 关于我们</div>

  <!-- ===================== 我的页面 ===================== -->
  <div id="myPage" class="page">
    <div class="user-info">
      <img class="avatar" src="https://airkbwolmkidaokqhxjj.supabase.co/storage/v1/object/public/Photos/123.jpg" alt="头像">
      <div class="info-text">
        <p class="username"><strong>用户名：</strong><span id="username">加载中...</span></p>
        <p class="platform"><strong>平台账号：</strong><span id="platformAccount">加载中...</span></p>
      </div>
    </div>

    <div class="balance-box">
      <p><strong>Balance：</strong><span id="balance">0.00</span></p>
      <div class="balance-actions">
        <button id="depositBtn">充值</button>
        <button id="withdrawBtn">提现</button>
      </div>
    </div>

    <div class="my-buttons">
      <button id="changeLoginPwdBtn">登入密码</button>
      <button id="logoutBtn">Logout</button>
    </div>

    <!-- 修改登录密码弹窗 -->
    <div id="changeLoginPwdModal" class="modal">
      <div class="modal-content">
        <h3>修改登录密码</h3>
        <input type="password" id="currentLoginPwd" placeholder="输入当前登录密码" />
        <input type="password" id="newLoginPwd" placeholder="输入新密码" />
        <input type="password" id="confirmLoginPwd" placeholder="确认新密码" />
        <div class="modal-actions">
          <button id="cancelChangeLoginPwd">取消</button>
          <button id="saveChangeLoginPwd">保存</button>
        </div>
      </div>
    </div>
  </div>

  <!-- ===================== 弹窗区域 ===================== -->
  <!-- Logout -->
  <div id="logoutModal" class="modal">
    <div class="modal-content">
      <p>确定要退出吗？</p>
      <button id="cancelLogout">否</button>
      <button id="confirmLogout">确定</button>
    </div>
  </div>

  <!-- 提现 -->
  <div id="withdrawModal" class="modal">
    <div class="modal-content">
      <h3>提现</h3>
      <p>当前余额：<span id="withdrawBalance">0.00</span></p>
      <input type="number" id="withdrawAmount" placeholder="输入提现金额" />
      <input type="text" id="walletAddress" placeholder="USDT-TRC20钱包地址" />
      <button id="setPasswordBtn">添加提现密码</button>
      <div class="modal-actions">
        <button id="cancelWithdraw">取消</button>
        <button id="confirmWithdraw">提交</button>
      </div>
    </div>
  </div>

  <!-- 设置提现密码 -->
  <div id="setPasswordModal" class="modal">
    <div class="modal-content">
      <h3>设置提现密码</h3>
      <input type="password" id="withdrawPwd" maxlength="6" inputmode="numeric" placeholder="输入6位数字密码" />
      <input type="password" id="confirmWithdrawPwd" maxlength="6" inputmode="numeric" placeholder="确认密码" />
      <div class="modal-actions">
        <button id="cancelSetPwd">取消</button>
        <button id="saveWithdrawPwd">保存</button>
      </div>
    </div>
  </div>

  <!-- 更新提现密码 -->
  <div id="updatePasswordModal" class="modal">
    <div class="modal-content">
      <h3>更改提现密码</h3>
      <input type="password" id="oldWithdrawPwd" maxlength="6" inputmode="numeric" placeholder="输入原密码" />
      <input type="password" id="newWithdrawPwd" maxlength="6" inputmode="numeric" placeholder="输入新密码" />
      <input type="password" id="confirmNewWithdrawPwd" maxlength="6" inputmode="numeric" placeholder="确认新密码" />
      <div class="modal-actions">
        <button id="cancelUpdatePwd">取消</button>
        <button id="saveUpdatePwd">保存</button>
      </div>
    </div>
  </div>

  <!-- 确认提现密码 -->
  <div id="confirmPwdModal" class="modal">
    <div class="modal-content">
      <h3>输入提现密码</h3>
      <input type="password" id="inputWithdrawPwd" maxlength="6" inputmode="numeric" placeholder="请输入密码" />
      <div class="modal-actions">
        <button id="cancelConfirmPwd">取消</button>
        <button id="submitWithdrawFinal">提交</button>
      </div>
    </div>
  </div>

  <!-- 充值 -->
  <div id="rechargeModal" class="modal">
    <div class="modal-content">
      <h3>充值</h3>
      <input type="file" id="fileInput" />
      <button id="uploadBtn">上传</button>
      <p id="status"></p>
      <div class="modal-actions">
        <button id="cancelRecharge">取消</button>
      </div>
    </div>
  </div>

  <!-- ===================== 底部导航栏 ===================== -->
  <div class="bottom-nav">
    <button data-page="homePage" class="active">Home</button>
    <button data-page="infoPage" id="messageBtn">
      Message
      <span id="bottomUnreadCount" class="unread-dot">0</span>
    </button>
    <button data-page="orderPage">Order</button>
    <button data-page="msgPage">About</button>
    <button data-page="myPage">Me</button>
  </div>

  <!-- JS -->
  <script src="Home/home.js"></script>
  <script src="Message/message.js"></script>
  <script src="Order/order.js"></script>
  <script src="About/about.js"></script>
  <script src="Me/me.js"></script>
  <script src="Button/button.js"></script>
  <script src="Recharge/recharge.js"></script>
</body>
</html>
