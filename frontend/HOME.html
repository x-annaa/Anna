<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>U9</title>

  <!-- css 部分 --> 
  <link rel="stylesheet" href="Home/home.css">
  <link rel="stylesheet" href="About/about.css">
  <link rel="stylesheet" href="Order/order.css">
  <link rel="stylesheet" href="Message/message.css">
  <link rel="stylesheet" href="Me/me.css">
  <!-- css 底部按钮部分 --> 
  <link rel="stylesheet" href="Button/button.css">

  <!-- Supabase SDK -->
  <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
  <!-- 全局 Supabase 初始化 -->
  <script src="../supabaseClient.js"></script>
</head>
<body>

  <!-- 首页 -->
  <div id="homePage" class="page active">🏠 HOME</div>

  <!-- 信息页面 -->
  <div id="infoPage" class="page">💬 MESSAGE</div>

  <!-- 订单页面 -->
  <div id="orderPage" class="page">
    <div class="order-header">
      <h2>📦 ORDER</h2>
      <div class="coins-box">
        💰 Coins: <span id="ordercoins">0</span>
        <button id="addCoinsBtn" title="从余额兑换Coins">+</button>
      </div>
    </div>

    <div class="order-actions">
      <button id="autoOrderBtn">🎲 一键刷单</button>
    </div>

    <div id="orderResult" class="order-result"></div>

    <div class="order-history">
      <h3>🕘 最近订单</h3>
      <ul id="recentOrders">
        <li>暂无订单！</li>
      </ul>
    </div>

    <div id="addCoinsModal" class="modal">
      <div class="modal-content">
        <h3>兑换 Coins</h3>
        <p>请输入要兑换的数量：</p>
        <input type="number" id="addCoinsInput" min="1" placeholder="输入数量" />
        <div class="modal-actions">
          <button id="cancelAddCoins">取消</button>
          <button id="confirmAddCoins">确认</button>
        </div>
      </div>
    </div>
  </div>

  <!-- 消息页面 -->
  <div id="msgPage" class="page">ℹ️ 关于我们</div>

  <!-- 我的页面 -->
  <div id="myPage" class="page">
    <h2>👤 我的页面</h2>

    <div class="user-info">
      <p><strong>平台账号：</strong><span id="platformAccount">加载中...</span></p>
      <p><strong>Balance：</strong><span id="balance">加载中...</span></p>
    </div>

    <div class="my-buttons">
      <!-- 横向按钮组 -->
      <div class="horizontal-buttons">
        <button id="withdrawBtn">Withdraw</button>
        <button id="rechargeBtn">Recharge</button>
      </div>

      <!-- 下面垂直排列的按钮 -->
      <button>按钮2</button>
      <button>按钮3</button>
      <button>按钮4</button>
      <button id="logoutBtn">Logout</button>
    </div>

    <!-- Recharge 弹窗 -->
    <div id="rechargeModal" class="modal">
      <div class="modal-content">
        <h3>充值</h3>
        <p>请选择充值方式：</p>
        <div class="recharge-options">
          <button data-method="USDT">USDT</button>
          <button data-method="BNB">BNB</button>
          <button data-method="Telegram">Telegram</button>
        </div>

        <div id="rechargeDetails" style="margin-top:15px;">
          <p><strong>充值方式：</strong><span id="selectedMethod">USDT</span></p>
          <p><strong>网络协议：</strong><span id="networkProtocol">TRC20</span></p>
          <p><strong>最小充值金额：</strong>10.00 USDT</p>
          <p><strong>钱包地址：</strong>
            <span id="walletAddress">TX6aSYyGVTf1NsXWzY3kUC9pTQPJPagJH</span>
            <button id="copyWallet">复制</button>
          </p>
        </div>

        <div class="modal-actions">
          <button id="cancelRecharge">取消</button>
          <button id="submitRecharge">提交</button>
        </div>
      </div>
    </div>

    <!-- Withdraw 弹窗 -->
    <div id="withdrawModal" class="modal">
      <div class="modal-content">
        <h3>提现</h3>
        <p>请输入提现金额：</p>
        <input type="number" id="withdrawAmount" placeholder="输入金额" min="1" />

        <div class="modal-actions">
          <button id="cancelWithdraw">取消</button>
          <button id="confirmWithdraw">提交</button>
        </div>
      </div>
    </div>

  </div>

  <!-- Logout 确认弹窗 -->
  <div id="logoutModal" class="modal">
    <div class="modal-content">
      <p>确定要退出吗？</p>
      <button id="cancelLogout">否</button>
      <button id="confirmLogout">确定</button>
    </div>
  </div>

  <!-- 底部导航栏 -->
  <div class="bottom-nav">
    <button data-page="homePage" class="active">Home</button>
    <button data-page="infoPage">Message</button>
    <button data-page="orderPage">Order</button>
    <button data-page="msgPage">About</button>
    <button data-page="myPage">Me</button>
  </div>

  <!-- JS 部分 --> 
  <script src="Home/home.js"></script>
  <script src="Message/message.js"></script>
  <script src="Order/order.js"></script>
  <script src="About/about.js"></script>
  <script src="Me/me.js"></script>
  <script src="Button/button.js"></script>
  
</body>
</html>
