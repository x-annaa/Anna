<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>U9 首页</title>

  <!-- CSS -->
  <link rel="stylesheet" href="Order/order.css">

  <!-- Supabase SDK -->
  <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
  <!-- 全局 Supabase 初始化 -->
  <script src="Order/supabaseClient.js"></script>
</head>
<body>
  <div class="container">
    <h1>🏠 U9 首页</h1>
    <p>Coins：<span id="ordercoins">0</span></p>
    <p>Balance：<span id="balanceDisplay">0</span></p>
    <p id="roundProgress">本轮已完成订单：0 / 0</p>

    <button id="autoOrderBtn">🎲 一键刷单</button>

    <h2>最近订单</h2>
    <ul id="recentOrders"></ul>

    <button id="addCoinsBtn">兑换刷单币</button>

    <div id="addCoinsModal" class="modal hidden">
      <div class="modal-content">
        <span id="cancelExchange" class="close">&times;</span>
        <h3>兑换刷单币</h3>
        <input type="number" id="exchangeAmount" placeholder="输入数量">
        <div class="exchange-options">
          <button id="balanceToCoinsBtn">余额→刷单币</button>
          <button id="coinsToBalanceBtn">刷单币→余额</button>
        </div>
        <button id="confirmExchange">确认兑换</button>
      </div>
    </div>

    <p id="cooldownDisplay"></p>
    <p id="matchingCountdown"></p>
    <p id="lastOrder"></p>
  </div>

  <!-- JS -->
  <script src="Order/order.js"></script>
</body>
</html>
