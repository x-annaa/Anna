<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>HOME</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="stylesheet" href="home.css" />

  <!-- Supabase SDK -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../supabaseClient.js"></script>
</head>
<body>
  <div class="container">
    <h1>Welcome, <span id="username"></span> 🎉</h1>
    <p>平台账号：<span id="platformAccount"></span></p>
    <p>UUID：<span id="uuid"></span></p>
    <button id="logoutBtn">退出登录</button>
  </div>

  <script>
    async function checkSession() {
      const userId = localStorage.getItem("currentUserId");
      const localToken = localStorage.getItem("sessionToken");
      const username = localStorage.getItem("currentUser");
      const platformAccount = localStorage.getItem("platformAccount");
      const uuid = localStorage.getItem("currentUserUUID");

      if (!userId || !localToken) {
        window.location.href = "../index.html";
        return;
      }

      const { data, error } = await supabaseClient
        .from("users")
        .select("session_token")
        .eq("id", userId)
        .maybeSingle();

      if (error || !data) {
        alert("用户验证失败");
        window.location.href = "../index.html";
        return;
      }

      if (data.session_token !== localToken) {
        alert("您的账号已在其他地方登录");
        localStorage.clear();
        window.location.href = "../index.html";
        return;
      }

      // 显示用户信息
      document.getElementById("username").textContent = username;
      document.getElementById("platformAccount").textContent = platformAccount;
      document.getElementById("uuid").textContent = uuid;
    }

    function logout() {
      localStorage.clear();
      window.location.href = "../index.html";
    }

    document.getElementById("logoutBtn").addEventListener("click", logout);

    checkSession();
  </script>
</body>
</html>
