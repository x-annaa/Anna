<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>U9</title>

  <!-- 样式 -->
  <link rel="stylesheet" href="home.css" />
  <link rel="stylesheet" href="order.css" />
  <link rel="stylesheet" href="message.css" /> 

  <!-- Supabase SDK（非模块，引入全局 supabase 变量，供模块使用） -->
  <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
</head>
<body>

  <!-- 首页 -->
  <div id="homePage" class="page active">🏠 首页内容</div>

  <!-- 信息页面 -->
  <div id="infoPage" class="page">ℹ️ 信息内容</div>

  <!-- 消息页面 -->
  <div id="msgPage" class="page">
    <div id="chat-widget">
      <div class="chat-header">💬 在线客服</div>
      <div id="chat-messages" class="chat-messages"></div>
      <form id="chat-form" class="chat-form">
        <input id="chat-input" type="text" placeholder="输入消息…" />
        <button type="submit">发送</button>
      </form>
    </div>
  </div>

  <!-- 我的页面 -->
  <div id="myPage" class="page">
    <h2>👤 我的页面</h2>
    <div class="user-info">
      <p><strong>平台账号：</strong><span id="platformAccount">加载中...</span></p>
      <p><strong>Coins：</strong><span id="coins">加载中...</span></p>
      <p><strong>Balance：</strong><span id="balance">加载中...</span></p>
    </div>

    <div class="my-buttons">
      <button>按钮1</button>
      <button>按钮2</button>
      <button>按钮3</button>
      <button>按钮4</button>
      <button id="logoutBtn">🚪 Logout</button>
    </div>
  </div>

  <!-- 📦 订单页面 -->
  <div id="orderPage" class="page">
    <div class="order-header">
      <h2>📦 订单中心</h2>
      <div class="coins-box">
        💰 Coins: <span id="ordercoins">0</span>
        <button id="addCoinsBtn" title="从余额兑换Coins">+</button>
      </div>
    </div>

    <div class="order-actions">
      <button id="autoOrderBtn">🎲 一键刷单</button>
      <button id="rechargeBtn">💳 充值</button>
    </div>

    <!-- 显示本次下单结果 -->
    <div id="orderResult" class="order-result"></div>

    <!-- 最近 5 个订单历史 -->
    <div class="order-history">
      <h3>🕘 最近 5 个订单</h3>
      <ul id="recentOrders">
        <li>暂无订单</li>
      </ul>
    </div>

    <!-- 💰 兑换 Coins 弹窗 -->
    <div id="addCoinsModal" class="modal">
      <div class="modal-content">
        <h3>兑换 Coins</h3>
        <p>请输入要兑换的数量：</p>
        <input type="number" id="addCoinsInput" min="1" placeholder="输入数量" />
        <div class="modal-actions">
          <button id="cancelAddCoins">取消</button>
          <button id="confirmAddCoins">确认</button>
        </div>
      </div>
    </div>
  </div>

  <!-- 底部导航栏 -->
  <div class="bottom-nav">
    <button data-page="homePage" class="active">首页</button>
    <button data-page="infoPage">信息</button>
    <button data-page="orderPage">订单</button>
    <button data-page="msgPage">消息</button>
    <button data-page="myPage">我的</button>
  </div>

  <!-- Logout 弹窗 -->
  <div id="logoutModal" class="modal">
    <div class="modal-content">
      <p>确定要退出吗？</p>
      <button id="cancelLogout">否</button>
      <button id="confirmLogout">确定</button>
    </div>
  </div>

  <!-- 模块化脚本（注意：不需要单独 <script> 引入 supabaseClient.js，模块里会 import） -->
  <script type="module" src="../supabaseClient.js"></script> <!-- 可选：如果想提早初始化 -->
  <script type="module" src="home.js"></script>
  <script type="module" src="order.js"></script>
  <script type="module" src="message.js"></script>
</body>
</html>
