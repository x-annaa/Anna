<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>U9 - 订单页面</title>
  <link rel="stylesheet" href="./Order/order.css"> <!-- 如果有单独css文件，可选 -->
  <style>
    body { font-family: Arial, sans-serif; background: #f5f5f5; margin: 0; padding: 0; }
    .page { max-width: 800px; margin: 20px auto; padding: 20px; background: white; border-radius: 10px; box-shadow: 0 0 10px rgba(0,0,0,0.1); }
    .order-header { margin-bottom: 20px; }
    .coins-box { margin-top: 10px; }
    .order-actions { margin: 20px 0; }
    #autoOrderBtn { padding: 10px 20px; font-size: 16px; cursor: pointer; }
    .order-result { margin-top: 20px; padding: 10px; border: 1px solid #ddd; border-radius: 5px; }
    .order-history ul { padding-left: 20px; }
    .modal { display: none; position: fixed; top:0; left:0; width:100%; height:100%; background: rgba(0,0,0,0.5); justify-content:center; align-items:center; z-index: 1000; }
    .modal-content { background:white; padding:20px; border-radius:10px; width:300px; text-align:center; }
    .modal-actions button { margin: 10px 5px 0 5px; padding: 5px 10px; cursor: pointer; }
    .exchange-toggle { display: flex; justify-content: space-between; margin-bottom: 10px; }
    .exchange-btn { flex:1; padding:5px; margin:0 5px; cursor:pointer; }
    .exchange-btn.active { background-color: #4CAF50; color:white; }
  </style>
</head>
<body>

  <div id="orderPage" class="page">
    <div class="order-header">
      <h2>📦 ORDER</h2>
      <div id="roundProgress" style="margin-bottom: 10px; font-weight: bold;">
        本轮完成订单：加载中...
      </div>
      <div class="coins-box">
        💰 Coins: <span id="ordercoins">0</span>
        <button id="addCoinsBtn" title="从余额兑换Coins">+</button>
      </div>
    </div>

    <div class="order-actions">
      <button id="autoOrderBtn">🎲 一键刷单</button>
      <p id="cooldownDisplay" style="color:red; font-weight:bold;"></p>
    </div>

    <div id="matchingGif" style="display:none; position:fixed; top:50%; left:50%; transform:translate(-50%, -50%); z-index:999;">
      <img src="https://ofaxbeydyeajdgwwqrzz.supabase.co/storage/v1/object/public/Photos/Qbox.gif" alt="正在匹配..." style="width:150px; height:150px;">
    </div>

    <div id="orderResult" class="order-result"></div>

    <div class="order-history">
      <h3>🕘 最近订单</h3>
      <ul id="recentOrders">
        <li>暂无订单！</li>
      </ul>
    </div>

    <!-- Balance / Coins 兑换弹窗 -->
    <div id="addCoinsModal" class="modal">
      <div class="modal-content">
        <h3>兑换 Coins / Balance</h3>

        <!-- 横排切换按钮 -->
        <div class="exchange-toggle">
          <button id="balanceToCoinsBtn" class="exchange-btn active" data-type="toCoins">Balance → Coins</button>
          <button id="coinsToBalanceBtn" class="exchange-btn" data-type="toBalance">Coins → Balance</button>
        </div>

        <p>请输入要兑换的数量：</p>
        <input type="number" id="addCoinsInput" min="1" placeholder="输入数量" />

        <div class="modal-actions">
          <button id="cancelExchange">取消</button>
          <button id="confirmExchange">确认</button>
        </div>
      </div>
    </div>
  </div>

  <!-- 引入 supabase 客户端 -->
  <script src="../supabaseClient.js"></script>
  <!-- 引入订单逻辑 -->
  <script src="./Order/order.js"></script>

</body>
</html>
