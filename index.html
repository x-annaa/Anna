<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>刷单测试页面</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 40px; }
    input { margin: 5px 0; padding: 5px; width: 200px; }
    button { padding: 5px 10px; margin-top: 10px; }
    .container { margin-bottom: 30px; }
    table { border-collapse: collapse; width: 80%; margin-top: 20px; }
    th, td { border: 1px solid #ccc; padding: 8px; text-align: center; }
  </style>
</head>
<body>

  <div class="container" id="registerBox">
    <h2>注册</h2>
    <input type="text" id="regUsername" placeholder="用户名"><br>
    <input type="password" id="regPassword" placeholder="密码"><br>
    <button id="btnRegister">注册</button>
    <p id="regMessage"></p>
  </div>

  <div class="container" id="loginBox">
    <h2>登录</h2>
    <input type="text" id="loginUsername" placeholder="用户名"><br>
    <input type="password" id="loginPassword" placeholder="密码"><br>
    <button id="btnLogin">登录</button>
    <p id="loginMessage"></p>
  </div>

  <div class="container" id="userPanel" style="display:none;">
    <h2>用户信息</h2>
    <p id="userInfo"></p>
    <button id="btnCreateOrder">创建订单</button>
    <p id="orderMessage"></p>

    <h3>订单记录</h3>
    <table id="ordersTable">
      <thead>
        <tr>
          <th>订单ID</th>
          <th>商品ID</th>
          <th>商品名称</th>
          <th>价格</th>
          <th>利润</th>
          <th>轮次</th>
          <th>匹配开始</th>
          <th>匹配结束</th>
          <th>冷却</th>
        </tr>
      </thead>
      <tbody></tbody>
    </table>
  </div>

  <!-- Supabase SDK -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabaseClient.js"></script>
  <script src="index.js"></script>
</body>
</html>
