<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>User Home</title>
  <link rel="stylesheet" href="index.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
  <h1>🎉 Welcome to Your Dashboard</h1>
  <p><strong>Username:</strong> <span id="username"></span></p>
  <p><strong>Platform Account:</strong> <span id="platform"></span></p>
  <p><strong>Balance:</strong> $<span id="balance"></span></p>

  <button id="logoutBtn">Logout</button>

  <script>
    // ⚡ 初始化 Supabase
    const SUPABASE_URL = "https://ffdrwsemmfvqlqhyjlnb.supabase.co";
    const SUPABASE_KEY = "eyJhbGciOi...你的KEY...";
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    // 检查登录状态
    const username = localStorage.getItem("username");
    if (!username) {
      alert("Please login first!");
      window.location.href = "index.html";
    } else {
      document.getElementById("username").textContent = username;

      // 查询用户的 balance 和 platform_account
      (async () => {
        const { data, error } = await supabaseClient
          .from("users")
          .select("platform_account, balance")
          .eq("username", username)
          .single();

        if (error) {
          alert("Error loading user info: " + error.message);
        } else {
          document.getElementById("platform").textContent = data.platform_account;
          document.getElementById("balance").textContent = data.balance;
        }
      })();
    }

    // 退出登录
    document.getElementById("logoutBtn").addEventListener("click", () => {
      localStorage.removeItem("username");
      window.location.href = "index.html";
    });
  </script>
</body>
</html>
